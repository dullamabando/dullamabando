!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulla Mabando - Bando za mitandao yote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF5A0A; --yellow:#FFD21A; --ink:#140C09; --cream:#FFF1DC; --plum:#1B0C1C;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{margin:0;font:italic 800 28px/1 var(--display);color:var(--yellow);letter-spacing:.01em}
.brand small{display:block;margin-top:3px;font:500 13px/1.2 var(--body);color:rgba(255,241,220,.7);letter-spacing:0}
.replay{appearance:none;background:transparent;color:var(--cream);border:1.5px solid rgba(255,241,220,.45);border-radius:999px;padding:9px 16px;min-height:40px;font:700 14px/1 var(--body);cursor:pointer}
.replay:hover{border-color:var(--yellow);color:var(--yellow)}

.stage{position:relative;overflow:hidden;background:linear-gradient(180deg,#14091A 0%,#34102A 36%,#8A2A1C 70%,#FF6A13 100%)}
.stage>*{position:absolute}
.layer{pointer-events:none;will-change:transform}
.layer svg{display:block}
.ground{left:0;right:0;bottom:0;background:linear-gradient(#4A322A 0 14%,#241713 14% 100%);border-top:2px solid #6B4A3C;overflow:hidden}
.ground::after{content:"";position:absolute;left:0;right:0;top:58%;height:3px;background:repeating-linear-gradient(90deg,rgba(255,241,220,.55) 0 38px,transparent 38px 96px);background-position-x:var(--gx,0px)}
.world{inset:0;will-change:transform}
.world>*{position:absolute}
.post{background:linear-gradient(90deg,#3a2a22,#16100d)}
.board{background:repeating-linear-gradient(135deg,#27170f 0 14px,#1d120e 14px 28px);border:3px solid #0d0705;border-radius:4px;transition:box-shadow 1.2s ease}
.stage.done .board{box-shadow:0 0 70px 8px rgba(255,90,10,.5)}
.tube{border-radius:999px;background:linear-gradient(#f7e9d0,#cfae7e 45%,#5e452d 100%);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.poster{overflow:hidden;background:#000}
.poster img{position:absolute;left:0;top:0;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.hem{background:var(--ink);border-bottom:3px solid var(--yellow);border-radius:0 0 3px 3px}
.glow{pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(255,236,170,.6),transparent 62%);mix-blend-mode:soft-light}
.lamp{background:#1a0f0b;border-radius:4px}
.lamp::after{content:"";position:absolute;left:14%;right:14%;bottom:-3px;height:4px;border-radius:4px;background:var(--yellow);opacity:calc(.2 + var(--lit,0)*.8);box-shadow:0 0 calc(var(--lit,0)*16px) rgba(255,210,26,.95)}
.cord{left:0;top:0;pointer-events:none;overflow:visible}
.person{overflow:visible;pointer-events:none}

/* ---------- action bar ---------- */
.bar{display:flex;gap:10px;padding:10px 16px 12px;background:var(--ink);border-top:1px solid rgba(255,241,220,.12)}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;font:700 17px/1 var(--body);text-decoration:none;white-space:nowrap}
.btn.call{background:var(--orange);color:var(--ink)}
.btn.wa{background:transparent;color:var(--cream);border:2px solid rgba(255,241,220,.5)}
.btn:hover{filter:brightness(1.1)}
.btn.wa:hover{border-color:var(--yellow);color:var(--yellow);filter:none}

/* ---------- content ---------- */
.content{max-width:760px;margin:0 auto;padding:56px 20px 72px}
.content h2{margin:0 0 6px;font:italic 800 clamp(34px,6vw,46px)/1.02 var(--display);color:var(--yellow)}
.content p{margin:0 0 18px;max-width:60ch;color:rgba(255,241,220,.82)}
.prices{margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));column-gap:36px}
.prices div{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(255,241,220,.15)}
.prices dt{font:700 20px/1 var(--display);font-style:italic;letter-spacing:.02em}
.prices dd{margin:0;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.sec{margin-top:64px}
.nets{margin:18px 0 0;font:italic 700 clamp(24px,4.6vw,32px)/1.25 var(--display)}
.phone{display:inline-block;margin:6px 0 20px;font:italic 800 clamp(48px,13vw,84px)/1 var(--display);color:var(--cream);text-decoration:none;border-bottom:4px solid var(--orange)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}
.cta-row .btn{flex:0 1 auto;min-width:200px}
footer{padding:22px 20px calc(30px + env(safe-area-inset-bottom,0px));text-align:center;color:rgba(255,241,220,.6);font-size:14px;border-top:1px solid rgba(255,241,220,.12)}

@media (max-width:420px){
  .brand{font-size:24px}
  .btn{font-size:16px;padding:0 10px}
}
</style>
</head>

<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulla Mabando</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7f0;--card:#fff;--ink:#1a1209;--mut:#6b5b4b;--or:#ff6a00;--yl:#ffc700;--ok:#12a150;--ln:#f0d9c4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150e08;--card:#241810;--ink:#fff3e6;--mut:#c4ab94;--ln:#3b2a1c}}
:root[data-theme="dark"]{--bg:#150e08;--card:#241810;--ink:#fff3e6;--mut:#c4ab94;--ln:#3b2a1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",Arial,sans-serif}
.w{max-width:640px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font:900 30px/1 "Arial Black",Impact,sans-serif;margin:0;letter-spacing:-1px}
h1 span{color:var(--or)}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--ink);max-width:48%}
.hero{margin:14px 0;padding:18px;border-radius:20px;background:linear-gradient(135deg,var(--or),#ff3d00);color:#fff}
.hero b{font-size:20px;display:block}
.steps{display:flex;gap:6px;margin:12px 0}
.st{flex:1;text-align:center;font-size:12px;padding:8px 2px;border-radius:12px;background:var(--card);border:2px solid var(--ln);color:var(--mut)}
.st.on{border-color:var(--or);color:var(--ink);font-weight:700}
.st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:18px}
.hint{color:var(--mut);margin:0 0 10px;font-size:14px}
.pt{display:inline-block;animation:pt 1s ease-in-out infinite;font-size:20px}
@keyframes pt{50%{transform:translateY(7px)}}
.nets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.net{padding:16px 8px;border-radius:14px;border:3px solid var(--ln);background:var(--card);color:var(--ink);font:800 17px inherit;cursor:pointer;transition:transform .15s}
.net:active{transform:scale(.95)}
.net.sel{border-color:var(--or);background:var(--yl);color:#1a1209;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk{padding:10px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--ink);cursor:pointer;font:inherit;text-align:center}
.pk b{display:block;font-size:20px}
.pk.sel{border-color:var(--or);background:var(--or);color:#fff;animation:pop .35s}
.pulse{animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,106,0,.6)}100%{box-shadow:0 0 0 14px rgba(255,106,0,0)}}
.sum{padding:12px;border-radius:12px;background:var(--bg);margin:10px 0;font-weight:700}
.pay{border-left:6px solid var(--yl);padding:8px 12px;margin:8px 0;background:var(--bg);border-radius:8px}
.pay big{display:block;font:900 24px "Arial Black",sans-serif;letter-spacing:1px}
.pay small{color:var(--mut)}
input[type=tel],input[type=text]{width:100%;font:inherit;padding:12px;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0 8px}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px dashed var(--or);border-radius:12px;font-weight:700}
label.ck input{width:24px;height:24px;flex:none}
.acts{display:grid;gap:10px;margin-top:12px}
.btn{display:block;text-align:center;padding:14px;border-radius:14px;font-weight:800;text-decoration:none;color:#fff;font-size:17px}
.wa{background:#25d366;color:#06361a}.cl{background:#1a1209}.sm{background:#2563eb}
.btn.off{opacity:.35;pointer-events:none}
.btn.go{animation:pl 1.6s infinite}
.msg{color:var(--or);font-weight:700;min-height:22px}
.sw{display:flex;gap:8px;margin:6px 0}
.sw button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.sw button.sel{border-color:var(--or);background:var(--yl);color:#1a1209;font-weight:700}
footer{text-align:center;color:var(--mut);font-size:13px;padding:12px}
#c2.halotel{background:#ff6a00;border-color:#ff6a00}
#c2.yas{background:#1e5bff;border-color:#1e5bff}
#c2.vodacom,#c2.airtel{background:#d9141e;border-color:#d9141e}
#c2.halotel,#c2.yas,#c2.vodacom,#c2.airtel{color:#fff}
#c2.halotel .hint,#c2.yas .hint,#c2.vodacom .hint,#c2.airtel .hint{color:#fff}
#c2.halotel .pk,#c2.yas .pk{background:rgba(0,0,0,.25);color:#fff;border-color:rgba(255,255,255,.45)}
#c2.halotel .pk.sel{background:#12a150;border-color:#fff;color:#fff}
#c2.yas .pk.sel{background:#fff;border-color:#fff;color:#1e5bff}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1>Dulla <span>Mabando</span></h1>
<select id="lang" aria-label="Language"></select></header>
<div class="hero"><b data-t="tag"></b><span data-t="sub"></span></div>
<div class="steps"><div class="st" id="s1"></div><div class="st" id="s2"></div><div class="st" id="s3"></div></div>

<section class="card" id="c1">
<h2 data-t="h1"></h2><p class="hint"><span class="pt">👇</span> <span data-t="p1"></span></p>
<div class="nets" id="nets"></div>
</section>

<section class="card" id="c2" hidden>
<h2 data-t="h2"></h2><p class="hint"><span class="pt">👇</span> <span data-t="p2"></span></p>
<div class="list" id="list"></div>
<div id="direct" hidden>
<p class="hint" id="dirt" style="font-size:17px;font-weight:700"></p>
<div class="acts"><a class="btn wa" id="dwa" target="_blank" rel="noopener">WhatsApp</a><a class="btn sm" id="dsm"></a></div>
</div>
</section>

<section class="card" id="c3" hidden>
<h2 data-t="h3"></h2>
<div class="sum" id="sum"></div>
<p class="hint">1️⃣ <span data-t="pay1"></span></p>
<div class="pay"><big>0614732395</big><small>YUSUPH ZAKARIA CHENGULA</small></div>
<div class="pay"><big>0651417108</big><small>ABDULRAHIM ZAKARIA CHENGULA</small></div>
<p class="hint">2️⃣ <span data-t="pay2"></span></p>
<input type="tel" id="ph" inputmode="tel" data-p="php">
<input type="text" id="tx" data-p="txp">
<input type="tel" id="pn" inputmode="tel" data-p="pnp">
<p class="hint">3️⃣ <span data-t="pay3"></span></p>
<label class="ck pulse"><input type="checkbox" id="ok"><span data-t="conf"></span></label>
<p class="msg" id="msg"></p>
<p class="hint">4️⃣ <span data-t="to"></span></p>
<div class="acts">
<a class="btn wa off" id="bwa" target="_blank" rel="noopener">WhatsApp</a>
<a class="btn cl off" id="bcl"></a>
<a class="btn sm off" id="bsm"></a>
</div>
</section>
<footer>Dulla Mabando · Halotel · Yas · Vodacom · Airtel</footer>
</div>
<script>
var T={
sw:{tag:"Bando za mitandao yote, haraka na bei nafuu",sub:"Halotel, Yas, Vodacom na Airtel — 24/7",s1:"1 Mtandao",s2:"2 Kifurushi",s3:"3 Lipa",h1:"Chagua mtandao wako",p1:"Bofya mtandao unaotumia",h2:"Chagua kifurushi",p2:"Bofya kifurushi unachotaka",dir:"Tunatoa pia na bando za {n} kwa maombi maalumu. Wasiliana nasi kwa WhatsApp moja kwa moja au tuma SMS moja kwa moja kwa mtoa huduma.",h3:"Lipa na uthibitishe",pay1:"Tuma pesa kwa namba hii:",pay2:"Jaza taarifa hizi:",pay3:"Ukishalipa, thibitisha hapa:",conf:"Nimelipa. Thibitisha malipo ili uendelee.",to:"Tuma oda yako kwa muuzaji:",call:"Piga simu",sms:"Tuma SMS",txp:"Jina la aliyelipa",php:"Namba ya kuwekewa bando",pnp:"Namba iliyolipa",need:"Jaza taarifa zote na uweke tiki ya malipo kwanza.",ready:"Sawa! Sasa tuma ombi lako 👇",pk:"Kifurushi",cust:"Kifurushi chako (mfano 5GB)",price:"Bei",net:"Mtandao",tsh:"TSh",other:"Wasiliana kwa bei",dirw:"HABARI DULLA MABANDO NAOMBA KUJUA BEI ZA BANDO ZA {n}"},
en:{tag:"Data bundles for all networks, fast and cheap",sub:"Halotel, Yas, Vodacom and Airtel — 24/7",s1:"1 Network",s2:"2 Bundle",s3:"3 Pay",h1:"Choose your network",p1:"Tap the network you use",h2:"Choose a bundle",p2:"Tap the bundle you want",dir:"We also sell {n} bundles on special request. Contact us directly on WhatsApp or send an SMS to the seller.",h3:"Pay and confirm",pay1:"Send money to this number:",pay2:"Fill in these details:",pay3:"After paying, confirm here:",conf:"I have paid. Confirm payment to continue.",to:"Send your order to the seller:",call:"Call",sms:"Send SMS",txp:"Name of the payer",php:"Number to receive the bundle",pnp:"Number that paid",need:"Fill in all details and tick the payment box first.",ready:"Done! Now send your request 👇",pk:"Bundle",cust:"Your bundle (e.g. 5GB)",price:"Price",net:"Network",tsh:"TSh",other:"Contact for price",dirw:"HELLO DULLA MABANDO, I WOULD LIKE TO KNOW THE PRICES OF {n} BUNDLES"}
};
var L={sw:"Kiswahili",en:"English"};
var N={halotel:{p:{3:4000,4:5000,5:6000,6:7000,7:8000,8:9000,9:9500,10:10000,15:15000,20:20000,30:30000,50:48000,100:90000}},
yas:{p:{1:1800,2:3600,3:5400,4:7200,5:9000,6:10800,7:12600,8:14400,9:16200,10:18000,20:35000,30:52000,40:70000,50:85000}},
vodacom:{},airtel:{}};
var NAMES={halotel:"Halotel",yas:"Yas",vodacom:"Vodacom",airtel:"Airtel"};
var NUMS=["0651417108"];
var st={lang:"sw",net:null,gb:null,num:0};
var $=function(i){return document.getElementById(i)};
function t(k){return (T[st.lang]||T.en)[k]||T.en[k]}
function fmt(n){return n.toLocaleString("en-US")}
function intl(n){return "255"+n.slice(1)}
function pkLabel(){if(!st.net)return "";var p=N[st.net].p;if(p)return st.gb+"GB — "+fmt(p[st.gb])+" "+t("tsh");return (st.gb||"")+""}
function msg(){var p=N[st.net].p;return "HABARI! DULLA MABANDO ❤❤❤\nNIMEKAMILISHA MALIPO NA KUWEKA ODA ✅️✅️\n\nTAARIFA ZA ODA\n■mtandao: "+NAMES[st.net]+"\n■Kifurushi: "+st.gb+"GB\n■Bei: "+fmt(p[st.gb])+" TSh\n■Namba inayowekewa bando: "+$("ph").value.trim()+"\n\nUTHIBITISHO WA MALIPO\n■jina la aliyelipa: "+$("tx").value.trim()+"\n■Namba iliyolipa: "+$("pn").value.trim()+"\nNaomba bando langu tafadhali🙏"}
function render(){
document.documentElement.lang=st.lang;document.documentElement.dir=st.lang=="ar"?"rtl":"ltr";
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=t(e.dataset.p)});
["s1","s2","s3"].forEach(function(k,i){var e=$(k);e.textContent=t(k);var step=!st.net?0:(!st.gb?1:2);e.className="st"+(i<step?" done":"")+(i==step?" on":"")});
$("nets").innerHTML="";
Object.keys(NAMES).forEach(function(k){var b=document.createElement("button");b.className="net"+(st.net==k?" sel":"");b.textContent=NAMES[k];b.onclick=function(){st.net=k;st.gb=null;render();$("c2").scrollIntoView({behavior:"smooth"})};$("nets").appendChild(b)});
$("c2").hidden=!st.net;
var p=st.net&&N[st.net].p;
$("list").innerHTML="";$("list").hidden=!p;$("direct").hidden=!st.net||!!p;
if(p)Object.keys(p).forEach(function(g){var b=document.createElement("button");b.className="pk"+(st.gb==g?" sel":"");b.innerHTML="<b>"+g+" GB</b>"+fmt(p[g])+" "+t("tsh");b.onclick=function(){st.gb=g;render();$("c3").scrollIntoView({behavior:"smooth"})};$("list").appendChild(b)});
$("c3").hidden=!(p&&st.gb);$("c2").className="card "+(st.net||"");
$("bcl").textContent="📞 "+t("call");
if(st.net&&!p){var dn=NAMES[st.net],dm=encodeURIComponent(t("dirw").replace("{n}",dn.toUpperCase()));$("dirt").textContent=t("dir").replace("{n}",dn);$("dwa").href="https://wa.me/255651417108?text="+dm;$("dsm").href="sms:+255651417108?body="+dm;$("dsm").textContent="✉️ "+t("sms")}
$("bsm").textContent="✉️ "+t("sms");
upd()}
function upd(){
$("sum").textContent=st.net?NAMES[st.net]+" • "+pkLabel():"";
var ok=$("ok").checked&&$("ph").value.trim().length>=9&&$("tx").value.trim()&&$("pn").value.trim().length>=9&&st.net&&st.gb;
$("msg").textContent=ok?t("ready"):t("need");
var n=NUMS[st.num],m=encodeURIComponent(st.net&&st.gb?msg():"");
$("bwa").href="https://wa.me/"+intl(n)+"?text="+m;
$("bcl").href="tel:+"+intl(n);
$("bsm").href="sms:+"+intl(n)+"?body="+m;
["bwa","bcl","bsm"].forEach(function(i){var e=$(i);e.classList.toggle("off",!ok);e.classList.toggle("go",!!ok)})}
var sel=$("lang");
Object.keys(L).forEach(function(k){sel.add(new Option(L[k],k))});
sel.onchange=function(){st.lang=sel.value;try{localStorage.setItem("dm_lang",st.lang)}catch(e){}render()};
$("ok").onchange=upd;$("ph").oninput=upd;$("tx").oninput=upd;$("pn").oninput=upd;
try{var s=localStorage.getItem("dm_lang");if(s&&T[s])st.lang=s}catch(e){}
sel.value=st.lang;render();
</script>
</body>
</html>

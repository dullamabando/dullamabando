<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulla Mabando</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --bg:#fff7f0;
  --card:#fff;
  --ink:#1a1209;
  --mut:#6b5b4b;
  --or:#ff6a00;
  --yl:#ffc700;
  --ok:#12a150;
  --ln:#f0d9c4;
}

*,*:before,*:after{
  box-sizing:inherit
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.5 "Trebuchet MS","Segoe UI",Arial,sans-serif;
}

.w{
  max-width:640px;
  margin:0 auto;
  padding:14px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

h1{
  font:900 30px/1 "Arial Black",Impact,sans-serif;
  margin:0;
  letter-spacing:-1px
}

h1 span{
  color:var(--or)
}

select{
  font:inherit;
  padding:8px;
  border-radius:10px;
  border:2px solid var(--ln);
  background:var(--card);
  color:var(--ink);
  max-width:48%
}

.hero{
  margin:14px 0;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--or),#ff3d00);
  color:#fff
}

.hero b{
  font-size:20px;
  display:block
}

.steps{
  display:flex;
  gap:6px;
  margin:12px 0
}

.st{
  flex:1;
  text-align:center;
  font-size:12px;
  padding:8px 2px;
  border-radius:12px;
  background:var(--card);
  border:2px solid var(--ln);
  color:var(--mut)
}

.st.on{
  border-color:var(--or);
  color:var(--ink);
  font-weight:700
}

.st.done{
  background:var(--ok);
  border-color:var(--ok);
  color:#fff
}

.card{
  background:var(--card);
  border:2px solid var(--ln);
  border-radius:18px;
  padding:14px;
  margin-bottom:12px
}

h2{
  margin:0 0 4px;
  font-size:18px
}

.hint{
  color:var(--mut);
  margin:0 0 10px;
  font-size:14px
}

.pt{
  display:inline-block;
  animation:pt 1s ease-in-out infinite;
  font-size:20px
}

@keyframes pt{
  50%{transform:translateY(7px)}
}

.nets{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.net{
  padding:16px 8px;
  border-radius:14px;
  border:3px solid var(--ln);
  background:var(--card);
  color:var(--ink);
  font:800 17px inherit;
  cursor:pointer;
  transition:transform .15s
}

.net:active{
  transform:scale(.95)
}

.net.sel{
  border-color:var(--or);
  background:var(--yl);
  color:#1a120
